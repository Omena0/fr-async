[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fr-async"
version = "0.1.0"
description = "Async but with yield instead of await"
readme = "README.md"
requires-python = ">=3.15"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
authors = [
    {name = "Omena0", email = "omena0mc@gmail.com"},
]
keywords = [
    "async",
    "asyncio",
    "concurrency",
    "event-loop",
    "generators",
    "cooperative-multitasking",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]
dependencies = []

[project.urls]
Documentation = "https://omena0.dev/fr-async"
Repository = "https://github.com/Omena0/fr-async"
Issues = "https://github.com/Omena0/fr-async/issues"

[tool.setuptools.packages.find]
include = ["fr_async*"]

[tool.pyright]
pythonVersion = "3.15"
typeCheckingMode = "strict"
reportMissingParameterType = "none"
reportUnusedVariable = "none"
reportUnusedImport = "none"
reportPrivateUsage = "none"

[tool.ruff.lint]
extend-select = [
    "A", "B", "BLE", "C4", "C90", "EM", "ERA", "FA", "FURB", "ISC",
    "N", "PERF", "PIE", "PLR", "RET", "RSE", "RUF", "SIM", "SLF",
    "SLOT", "TC", "UP",
]
extend-ignore = [
    "TRY300", "PLR2004", "S310", "S101", "S603", "S607", "G004",
    "RUF001", "BLE001", "EM101", "TC003", "E722", "RUF059", "F841",
    "SIM102", "N802", "SLF001", "TC001", "N818", "SIM115", "B026",
    "I001"
]

exclude = [
    "fr_async/http_bench.py",
    "fr_async/server.py"
]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.pylint]
max-branches = 15
max-returns = 7
max-args = 8

[tool.refurb]
ignore = ["FURB107", "FURB120"]
