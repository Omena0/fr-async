name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check with autofix
        run: ruff check --fix .

      - name: Commit autofixes
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(lint): autofix ruff issues"
          git push
