name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check with autofix
        id: lint
        run: |
          ruff check --fix . > /tmp/ruff_output.txt 2>&1 || true

      - name: Commit autofixes
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          fixed=$(grep -c "Fixed " /tmp/ruff_output.txt || true)
          msg="chore(lint): autofix ruff issues"
          if [ "$fixed" -gt 0 ]; then
            msg="$msg ($fixed fixes)"
          fi
          git commit -m "$msg"
          git push
