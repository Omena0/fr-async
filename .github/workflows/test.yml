name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Run test suite
        id: test
        run: |
          python -m fr_async.test | tee /tmp/test_output.txt
          score=$(grep -oP 'General score: \K[0-9.]+' /tmp/test_output.txt)
          echo "score=$score" >> $GITHUB_OUTPUT
          if grep -q "All tests passed" /tmp/test_output.txt; then
            echo "status=passing" >> $GITHUB_OUTPUT
            color="brightgreen"
          else
            echo "status=failing" >> $GITHUB_OUTPUT
            color="red"
          fi
          mkdir -p .github/badges
          cat > .github/badges/test-score.json <<EOF
          {"schemaVersion":1,"label":"Test","message":"${score}%","color":"${color}"}
          EOF

      - name: Commit badge
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .github/badges/test-score.json
          git diff --cached --quiet || git commit -m "Update test score badge"
          git push
